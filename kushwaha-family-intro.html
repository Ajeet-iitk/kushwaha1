<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Kushwaha Family — Animated Intro</title>
<style>
  :root{
    --ink:#2a1a12;
    --frame-w:1280px;
    --frame-h:720px;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;overflow:hidden;background:#0b0912;
    font-family:"Baloo 2","Comic Sans MS","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #wrap{position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(1200px 700px at 50% 40%,#1a1630,#07060d 70%)}
  #frame{
    position:absolute;left:50%;top:50%;
    width:var(--frame-w);height:var(--frame-h);
    transform-origin:center center;overflow:hidden;border-radius:20px;
    box-shadow:0 40px 90px rgba(0,0,0,.75),0 0 0 3px #241a33 inset;
    background:#8fd4ff;
  }

  /* ---------------- sky / background ---------------- */
  .bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  .bg *{stroke:none}
  .sun-glow{animation:sunPulse 4s ease-in-out infinite}
  @keyframes sunPulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.08);opacity:.8}}
  .rays{transform-box:fill-box;transform-origin:center;animation:spinSlow 60s linear infinite}
  @keyframes spinSlow{to{transform:rotate(360deg)}}
  .cloud{animation:drift 26s linear infinite}
  .cloud.c2{animation-duration:38s;animation-delay:-6s}
  .cloud.c3{animation-duration:46s;animation-delay:-18s}
  @keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1360px)}}

  /* ---------------- stage floor ---------------- */
  .floor{position:absolute;left:-40px;right:-40px;bottom:-90px;height:330px;z-index:2;
    border-radius:50% 50% 0 0/90px 90px 0 0;
    background:linear-gradient(#7dd06a,#4fa83f 55%,#3c8733);
    box-shadow:0 -6px 0 rgba(255,255,255,.25) inset}
  .floor:after{content:"";position:absolute;inset:0;border-radius:inherit;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 40px,transparent 40px 80px)}
  .flowers{position:absolute;left:0;right:0;bottom:196px;height:60px;z-index:2;opacity:.95}

  /* ---------------- wedding + bidaai ---------------- */
  #shaadi{position:absolute;inset:0;width:100%;height:100%;z-index:4;opacity:0;
    transition:opacity 1.4s ease;pointer-events:none}
  #shaadi svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  #shaadi.on{opacity:1}
  .stage{transition:transform 1.2s cubic-bezier(.4,0,.2,1)}
  .stage.centered4{transform:translateX(119px)}
  .slot{transition:transform 2.2s cubic-bezier(.45,0,.55,1),opacity 2.4s ease}
  .slot.leaving{transform:translateX(600px) rotate(4deg);opacity:0}
  .cheer .slot .arm-r{animation:wave .95s ease-in-out infinite}
  .cheer .slot .arm-l{animation:armIdle 1.05s ease-in-out infinite}
  /* little tears for Mummy during the vidaai */
  .tear{position:absolute;width:11px;height:15px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
    background:#8fdcff;border:2px solid #2a1a12;opacity:0;z-index:7}
  .tear.t1{left:41%;top:31%}
  .tear.t2{left:58%;top:31%}
  .slot.crying .tear{animation:tearFall 1.5s ease-in infinite}
  .slot.crying .tear.t2{animation-delay:.55s}
  @keyframes tearFall{
    0%{opacity:0;transform:translateY(-2px) scale(.6)}
    25%{opacity:1;transform:translateY(7px) scale(1)}
    100%{opacity:0;transform:translateY(36px) scale(.8)}
  }
  /* framed wedding photo of the bride */
  #framed{position:absolute;left:40px;top:124px;width:180px;z-index:9;opacity:0;
    transform:scale(.35) rotate(-11deg);transition:opacity .5s ease,transform .65s cubic-bezier(.3,1.7,.5,1);
    pointer-events:none;text-align:center}
  #framed.on{opacity:1;transform:none}
  #framed .pic{position:relative;height:168px;overflow:hidden;border:7px solid #e8a90a;border-radius:14px;
    background:linear-gradient(#fff8e6,#ffe9c2);
    box-shadow:0 10px 0 rgba(0,0,0,.3),0 0 28px rgba(255,215,90,.55)}
  #framed .pic .char-svg{width:232px;position:absolute;left:-21px;top:-30px}
  #framed .cap{margin-top:7px;font-size:23px;font-weight:800;color:#fff;text-shadow:0 3px 0 #2a1a12}
  #framed .cap small{display:block;font-size:14px;font-weight:700;color:#ffe9a8;text-shadow:0 2px 0 #2a1a12}

  /* ---------------- Indian festive decor ---------------- */
  .toran{position:absolute;left:0;right:0;top:0;width:100%;height:120px;z-index:1;pointer-events:none}
  .decor{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .34s ease-in-out infinite alternate}
  @keyframes flicker{from{transform:scale(1,.94);opacity:.92}to{transform:scale(.9,1.22);opacity:1}}
  .diya-glow{transform-box:fill-box;transform-origin:50% 60%;animation:diyaGlow 1s ease-in-out infinite alternate}
  @keyframes diyaGlow{from{opacity:.28;transform:scale(1)}to{opacity:.6;transform:scale(1.18)}}

  /* ---------------- spotlight ---------------- */
  #spot{position:absolute;left:0;top:0;width:620px;height:620px;z-index:3;
    transform:translate(-9999px,-9999px);opacity:0;transition:opacity .45s ease,transform .5s cubic-bezier(.3,1.3,.5,1);
    pointer-events:none;
    background:radial-gradient(circle,rgba(255,247,190,.62) 0%,rgba(255,235,140,.30) 38%,rgba(255,230,120,0) 68%)}
  #spot.on{opacity:1}

  /* ---------------- characters ---------------- */
  .stage{position:absolute;left:0;right:0;bottom:22px;height:360px;z-index:5;
    display:flex;align-items:flex-end;justify-content:center;gap:6px}
  .slot{position:relative;width:232px;height:348px;display:flex;align-items:flex-end;justify-content:center}
  .in{transform-origin:50% 100%;transition:transform .5s cubic-bezier(.34,1.4,.64,1),filter .4s ease,opacity .4s ease;
    opacity:0;transform:translateY(60px) scale(.25)}
  .slot.visible .in{opacity:1;transform:translateY(0) scale(1)}
  .slot.dim .in{filter:brightness(.62) saturate(.75);transform:translateY(6px) scale(.9)}
  .slot.active .in{transform:translateY(-30px) scale(1.24)}
  .idle{animation:bob 1.9s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .slot.active .idle{animation:bobBig 1.1s ease-in-out infinite}
  @keyframes bobBig{0%,100%{transform:translateY(0) rotate(-1.4deg)}50%{transform:translateY(-14px) rotate(1.4deg)}}
  .party .idle{animation:jump 1s cubic-bezier(.36,1.6,.5,1) infinite}
  @keyframes jump{0%,100%{transform:translateY(0) scaleY(1)}30%{transform:translateY(-34px) scaleY(1.06)}60%{transform:translateY(0) scaleY(.94)}80%{transform:translateY(-8px) scaleY(1.02)}}
  .party .in{transform:translateY(0) scale(1)}

  .char-svg{width:calc(220px * var(--size,1));height:auto;display:block;
    filter:drop-shadow(0 10px 6px rgba(0,0,0,.18))}
  .char-svg *{stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .char-svg .noline{stroke:none;stroke-width:0}
  .char-svg .skin{fill:var(--skin)}
  .char-svg .shirt{fill:var(--shirt)}
  .char-svg .pants{fill:var(--pants)}
  .char-svg .shoe{fill:var(--shoe)}
  .char-svg .hairshape{fill:var(--hair)}
  .char-svg .eyew{fill:#fff}
  .char-svg .pupil{fill:var(--ink)}
  .char-svg .glint{fill:#fff}
  .char-svg .blush{fill:#ff8fa3;opacity:.5}
  .char-svg .gshadow{fill:rgba(0,0,0,.15)}
  .char-svg .mouth{fill:none;stroke-width:6}
  .char-svg .nose{fill:none;stroke-width:4.5}
  .char-svg .brow{fill:none;stroke-width:5.5}
  .char-svg .hp{fill:none;stroke-width:9}
  .char-svg .drapery{fill:var(--outfit,#c2255f)}
  .char-svg .chunni{fill:var(--accent,#ffcf3f)}
  .char-svg .accentFill{fill:var(--accent,#ffcf3f)}
  .char-svg .accentLine{fill:none;stroke:var(--accent,#ffcf3f);stroke-width:5}
  .char-svg .deepLine{fill:none;stroke:#c98a06;stroke-width:4.5}
  .char-svg .detail{fill:none;stroke:rgba(0,0,0,.26);stroke-width:3.5}

  /* blinking */
  .eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s infinite}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  .s-anil .eye{animation-delay:.2s}
  .s-vijay .eye{animation-delay:1.5s}
  .s-amit .eye{animation-delay:2.7s}
  .s-pooja .eye{animation-delay:3.6s}
  .s-ajeet .eye{animation-delay:.9s;animation-duration:3.8s}

  /* arms */
  .arm{transform-box:fill-box;transform-origin:50% 0%;transition:transform .3s ease}
  .slot.active .arm-r{animation:wave 1s ease-in-out infinite}
  @keyframes wave{
    0%{transform:rotate(0)}
    30%{transform:rotate(-142deg)}
    45%{transform:rotate(-120deg)}
    60%{transform:rotate(-152deg)}
    75%{transform:rotate(-122deg)}
    100%{transform:rotate(-142deg)}
  }
  .slot.active .arm-l{animation:armIdle 1.1s ease-in-out infinite}
  @keyframes armIdle{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-10deg)}}

  /* ---- bobble-head: head wobbles on a springy neck ---- */
  .head{transform-box:view-box;transform-origin:110px 150px;
    animation:bobbleHead 2.6s ease-in-out infinite}
  @keyframes bobbleHead{
    0%  {transform:rotate(-8deg)   scale(var(--hs,1))}
    16% {transform:rotate(6.5deg)  scale(var(--hs,1))}
    32% {transform:rotate(-5.5deg) scale(var(--hs,1))}
    48% {transform:rotate(5deg)    scale(var(--hs,1))}
    64% {transform:rotate(-3deg)   scale(var(--hs,1))}
    80% {transform:rotate(2.5deg)  scale(var(--hs,1))}
    100%{transform:rotate(-8deg)   scale(var(--hs,1))}
  }
  .s-anil  .head{animation-duration:2.75s;animation-delay:-.2s}
  .s-vijay .head{animation-duration:2.4s; animation-delay:-.9s}
  .s-amit  .head{animation-duration:3.05s;animation-delay:-1.6s}
  .s-pooja .head{animation-duration:2.5s; animation-delay:-2.2s}
  .s-ajeet .head{animation-duration:1.85s;animation-delay:-.45s}
  /* the featured member gets a big springy wobble burst, then keeps bobbing */
  .slot.active .head{animation:wobbleBurst 1.05s cubic-bezier(.3,1.35,.5,1),
                                bobbleHead 1.5s ease-in-out 1.05s infinite}
  @keyframes wobbleBurst{
    0%  {transform:rotate(0)      scale(var(--hs,1))}
    12% {transform:rotate(-21deg) scale(var(--hs,1))}
    26% {transform:rotate(18deg)  scale(var(--hs,1))}
    40% {transform:rotate(-13deg) scale(var(--hs,1))}
    55% {transform:rotate(9.5deg) scale(var(--hs,1))}
    70% {transform:rotate(-6deg)  scale(var(--hs,1))}
    85% {transform:rotate(3deg)   scale(var(--hs,1))}
    100%{transform:rotate(0)      scale(var(--hs,1))}
  }
  /* the whole family's heads wobble when Ajeet does something silly */
  .reaction .head{animation:wobbleBurst .9s ease-out}
  .party .head{animation:bobbleHead 1.15s ease-in-out infinite}

  /* Ajeet = star of the house */
  .starBadge{position:absolute;z-index:6;left:50%;top:-26px;width:64px;height:64px;margin-left:-32px;opacity:0;
    transform:scale(.2) rotate(-40deg);transition:opacity .35s ease,transform .5s cubic-bezier(.3,1.7,.5,1);
    filter:drop-shadow(0 0 12px #ffd84d) drop-shadow(0 2px 0 #2a1a12);pointer-events:none}
  .slot.active .starBadge,.party .starBadge{opacity:1;animation:starSpin 3.4s linear infinite}
  @keyframes starSpin{0%{transform:scale(1) rotate(0)}100%{transform:scale(1) rotate(360deg)}}
  .slot.superjump .idle,.slot.active.superjump .idle{animation:superJump 1.15s cubic-bezier(.3,1.5,.5,1) 2}
  @keyframes superJump{
    0%{transform:translateY(0) scaleY(1)}
    18%{transform:translateY(-96px) scaleY(1.14) rotate(-4deg)}
    40%{transform:translateY(0) scaleY(.86) rotate(3deg)}
    58%{transform:translateY(-48px) scaleY(1.08) rotate(-2deg)}
    78%{transform:translateY(0) scaleY(.92)}
    100%{transform:translateY(0) scaleY(1)}
  }
  .lol{position:absolute;font-size:52px;opacity:0;pointer-events:none;animation:lolUp 1.9s ease-out forwards}
  @keyframes lolUp{0%{opacity:0;transform:scale(.3)}
    18%{opacity:1;transform:scale(1.12)}
    62%{opacity:1;transform:translateY(-52px) scale(1.05) rotate(6deg)}
    100%{opacity:0;transform:translateY(-110px) scale(1.15) rotate(20deg)}}

  /* sparkles around active char */
  .spark{position:absolute;font-size:30px;line-height:1;opacity:0;color:#fff45c;z-index:6;
    text-shadow:0 0 14px #ffe14d,0 0 4px #fff;pointer-events:none}
  .spark.s1{top:-6px;left:-14px}
  .spark.s2{top:52px;right:-16px;font-size:22px}
  .spark.s3{bottom:120px;left:-24px;font-size:24px}
  .spark.s4{bottom:40px;right:-10px;font-size:34px}
  .slot.active .spark{animation:twinkle 1.05s ease-in-out infinite}
  .slot.active .spark.s2{animation-delay:.25s}
  .slot.active .spark.s3{animation-delay:.5s}
  .slot.active .spark.s4{animation-delay:.75s}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(-20deg)}50%{opacity:1;transform:scale(1.15) rotate(15deg)}}

  /* ---------------- speech bubble ---------------- */
  #bubble{position:absolute;z-index:9;max-width:300px;padding:14px 20px;border-radius:22px;
    background:#fffdf5;border:5px solid var(--ink);color:#2a1a12;font-size:26px;line-height:1.15;
    letter-spacing:.2px;text-align:center;pointer-events:none;opacity:0;
    transform:translate(-50%,-100%) scale(.3);transform-origin:50% 120%;
    transition:opacity .22s ease,transform .34s cubic-bezier(.34,1.6,.6,1);
    box-shadow:0 8px 0 rgba(0,0,0,.15)}
  #bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
  #bubble:after{content:"";position:absolute;left:50%;bottom:-26px;margin-left:-14px;
    width:0;height:0;border:14px solid transparent;border-top-color:var(--ink);border-bottom:0}
  #bubble:before{content:"";position:absolute;left:50%;bottom:-17px;margin-left:-10px;z-index:1;
    width:0;height:0;border:10px solid transparent;border-top-color:#fffdf5;border-bottom:0}

  /* ---------------- title + name card ---------------- */
  .topbar{position:absolute;inset:0;z-index:16;pointer-events:none}
  #logo{position:absolute;top:26px;left:34px;font-size:30px;font-weight:800;color:#fff;
    text-shadow:0 4px 0 #2a1a12,0 0 22px rgba(0,0,0,.35);opacity:0;transform:scale(.8);
    transition:opacity .5s ease,transform .5s cubic-bezier(.34,1.6,.6,1),top .5s ease,left .5s ease,font-size .5s ease}
  #logo.show{opacity:1;transform:scale(1)}
  #logo span{color:#ffd84d}
  #logo.big{top:112px;left:50%;transform:translateX(-50%) scale(1);font-size:92px;text-align:center;white-space:nowrap;
    text-shadow:0 7px 0 #2a1a12,0 14px 26px rgba(0,0,0,.4)}
  #logo.big.show{transform:translateX(-50%) scale(1);animation:logoPop .8s cubic-bezier(.34,1.7,.5,1)}
  @keyframes logoPop{0%{transform:translateX(-50%) scale(.4) rotate(-5deg)}60%{transform:translateX(-50%) scale(1.12) rotate(2deg)}100%{transform:translateX(-50%) scale(1)}}
  #logo .ltr{display:inline-block;animation:ltrIn .5s backwards cubic-bezier(.3,1.7,.5,1)}
  @keyframes ltrIn{from{transform:translateY(-40px) scale(.2) rotate(-25deg);opacity:0}}
  #logo .sub{font-size:30px;line-height:1.25;margin-top:4px;color:#fff;font-weight:800;
    text-shadow:0 4px 0 #2a1a12}

  #card{position:absolute;top:18px;left:50%;transform:translate(-50%,-70px) scale(.85);opacity:0;
    padding:8px 26px 12px;border-radius:24px;background:#fffdf5;border:5px solid var(--ink);text-align:center;
    box-shadow:0 10px 0 rgba(0,0,0,.2);transition:opacity .3s ease,transform .45s cubic-bezier(.34,1.6,.6,1)}
  #card.on{opacity:1;transform:translate(-50%,0) scale(1)}
  #cname{font-size:38px;font-weight:900;line-height:1;letter-spacing:1px;color:#1f2a63}
  #crole{display:inline-block;margin-top:4px;padding:2px 15px;border-radius:999px;background:#ffd84d;
    border:3px solid var(--ink);font-size:18px;font-weight:800;color:#5a3c00}
  #ctag{margin-top:6px;font-size:18px;font-weight:600;color:#6a5747;max-width:620px}

  /* ---------------- fx: confetti, hearts, flash ---------------- */
  #fx{position:absolute;inset:0;z-index:12;overflow:hidden;pointer-events:none}
  .conf{position:absolute;top:-50px;border-radius:3px;animation:confFall linear forwards;
    box-shadow:0 0 4px rgba(0,0,0,.15)}
  @keyframes confFall{
    0%{transform:translate(0,0) rotate(0);opacity:1}
    100%{transform:translate(var(--dx),820px) rotate(760deg);opacity:.85}
  }
  .heart{position:absolute;bottom:-40px;font-size:36px;animation:floatUp linear forwards;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
  @keyframes floatUp{0%{transform:translate(0,0) scale(.5);opacity:0}
    15%{opacity:1}100%{transform:translate(var(--dx),-780px) scale(1.15) rotate(var(--rot));opacity:0}}
  #flash{position:absolute;inset:0;z-index:13;background:#fff;opacity:0;pointer-events:none;
    transition:opacity .5s ease}
  #flash.on{opacity:.72;transition:opacity .06s ease}

  /* ---------------- curtains ---------------- */
  .curtain{position:absolute;top:0;bottom:0;width:56%;z-index:14;
    background:
      repeating-linear-gradient(90deg,#a1112b 0 26px,#c2172f 26px 44px,#8d0e24 44px 70px);
    box-shadow:0 0 60px rgba(0,0,0,.6) inset;
    transition:transform 1.1s cubic-bezier(.7,0,.25,1)}
  .curtain.left{left:0;transform:translateX(0)}
  .curtain.right{right:0;transform:translateX(0);
    background:repeating-linear-gradient(90deg,#8d0e24 0 26px,#c2172f 26px 44px,#a1112b 44px 70px)}
  .curtain:after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.45))}
  .curtain.right:after{background:linear-gradient(270deg,rgba(0,0,0,.45),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.45))}
  .open .curtain.left{transform:translateX(-102%)}
  .open .curtain.right{transform:translateX(102%)}
  .valance{position:absolute;top:0;left:0;right:0;height:74px;z-index:15;
    background:linear-gradient(#8d0e24,#b3142c);border-bottom:6px solid #5e0817;
    box-shadow:0 6px 20px rgba(0,0,0,.4);transition:transform .8s ease}
  .open .valance{transform:translateY(-100%)}

  /* ---------------- controls ---------------- */
  .controls{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;
    display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;
    background:rgba(16,10,26,.66);backdrop-filter:blur(8px);border:3px solid rgba(255,255,255,.18);
    opacity:0;transition:opacity .4s ease;pointer-events:none}
  .controls.on{opacity:1;pointer-events:auto}
  .controls button{font:inherit;font-weight:800;font-size:17px;color:#fff;cursor:pointer;
    padding:7px 16px;border-radius:999px;border:3px solid #2a1a12;background:#6b4bd6;
    box-shadow:0 4px 0 #2a1a12;transition:transform .12s ease,background .2s ease}
  .controls button:hover{background:#7f5cf0}
  .controls button:active{transform:translateY(4px);box-shadow:0 0 0 #2a1a12}
  .controls button.on{background:#25b06a}
  .controls button.rec{background:#e0353f}
  .bar{margin-left:6px;width:220px;height:11px;border-radius:999px;background:rgba(255,255,255,.16);
    overflow:hidden;border:2px solid rgba(0,0,0,.4)}
  .bar i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#ffd84d,#ff8a3d,#ff5f8d)}

  /* ---------------- overlay ---------------- */
  #overlay{position:absolute;inset:0;z-index:30;display:grid;place-content:center;justify-items:center;gap:18px;
    background:radial-gradient(circle at 50% 45%,rgba(20,14,40,.72),rgba(6,4,12,.93));
    transition:opacity .5s ease}
  #overlay.hide{opacity:0;pointer-events:none}
  .play{font:inherit;font-size:44px;font-weight:900;color:#3a2500;cursor:pointer;
    padding:18px 54px;border-radius:999px;border:6px solid #2a1a12;
    background:linear-gradient(#ffe27a,#ffbe28);box-shadow:0 10px 0 #2a1a12,0 22px 40px rgba(0,0,0,.5);
    transition:transform .15s ease,box-shadow .15s ease;animation:playPulse 1.9s ease-in-out infinite}
  .play:hover{transform:translateY(-3px) scale(1.03)}
  .play:active{transform:translateY(8px);box-shadow:0 2px 0 #2a1a12}
  @keyframes playPulse{0%,100%{box-shadow:0 10px 0 #2a1a12,0 22px 40px rgba(0,0,0,.5)}50%{box-shadow:0 10px 0 #2a1a12,0 22px 60px rgba(255,200,60,.45)}}
  #overlay h1{margin:0;font-size:54px;color:#fff;text-shadow:0 5px 0 #2a1a12;letter-spacing:1px}
  #overlay h1 span{color:#ffd84d}
  .hint{color:#c9bde6;font-size:19px;font-weight:600}
  .recbar{display:flex;gap:10px;align-items:center;position:relative;z-index:31}

  master.connect(comp); comp.connect(actx.destination);

  if (!noiseBuf){
    const n = Math.floor(actx.sampleRate * 1.5);

function tone(o){
  if (!actx) return;
  const t0 = actx.currentTime + (o.at || 0);
  const dur = o.dur || 0.2, vol = o.vol == null ? 0.3 : o.vol;
  const osc = actx.createOscillator();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.freq, t0);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur);
  const g = actx.createGain();
  const a = o.attack == null ? 0.008 : o.attack;

  }

}
/* a noise burst */
function nz(o){
  if (!actx) return;

  src.connect(f); f.connect(g); g.connect(o.bus || sfxBus);

/* ---- Indian festive decor: toran, rangoli, diyas, banana leaves ---- */
function buildToran(){
  let h = '<path d="M0 6 Q640 34 1280 6" fill="none" stroke="#8a5a2b" stroke-width="5"/>';
  for (let i = 0; i <= 30; i++){
    const t = i / 30, x = t * 1280, y = 2 + Math.sin(t * Math.PI) * 24;
    const c = i % 2 ? '#ff8c1a' : '#ffb02e';
    h += '<path d="M' + (x - 8).toFixed(0) + ' ' + (y + 7).toFixed(0) + ' q8 20 16 0 q-8 -8 -16 0 z" ' +
         'fill="#2f9e3f" stroke="#1c6b28" stroke-width="2.5" stroke-linejoin="round"/>';
    h += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="13" fill="' + c +
         '" stroke="#b35c00" stroke-width="3"/>';
    h += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="4.5" fill="#ffe0a3" opacity=".8"/>';
  }
  $('#toranG').innerHTML = h;
}
function diya(x, y, delay){
  return '<g>' +
    '<ellipse class="diya-glow" cx="' + x + '" cy="' + (y - 14) + '" rx="26" ry="24" fill="#ffd84d"/>' +
    '<path d="M' + (x - 17) + ' ' + y + ' q17 22 34 0 z" fill="#c1633a" stroke="#7d3a1c" stroke-width="3"/>' +
    '<ellipse cx="' + x + '" cy="' + y + '" rx="17" ry="5.5" fill="#e79a63" stroke="#7d3a1c" stroke-width="3"/>' +
    '<path class="flame" style="animation-delay:' + delay + 's" d="M' + x + ' ' + (y - 30) +
      ' q12 15 0 24 q-12 -9 0 -24 z" fill="#ffe98a" stroke="#ff8c1a" stroke-width="2.5"/>' +
  '</g>';
}
function rangoli(cx, cy){
  const cols = ['#ff5f8d','#ffd84d','#4ad6a5','#ffffff','#ff8a3d'];
  let h = '';
  for (let r = 1; r <= 3; r++)
    h += '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + (r * 22) + '" ry="' + (r * 9) +
         '" fill="none" stroke="' + cols[r] + '" stroke-width="5"/>';
  for (let a = 0; a < 10; a++){
    const ang = a * Math.PI / 5;
    h += '<circle cx="' + (cx + Math.cos(ang) * 50).toFixed(0) + '" cy="' + (cy + Math.sin(ang) * 21).toFixed(0) +
         '" r="6.5" fill="' + cols[a % 5] + '" stroke="#2a1a12" stroke-width="2.5"/>';
  }
  h += '<circle cx="' + cx + '" cy="' + cy + '" r="11" fill="#ffd84d" stroke="#2a1a12" stroke-width="3"/>';
  return h;
}
function bananaPlant(x, y, s){
  let h = '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">';
  for (let i = -2; i <= 2; i++){
    const rot = i * 26;
    h += '<g transform="rotate(' + rot + ')"><path d="M0 0 Q22 -40 4 -96 Q-16 -44 0 0 Z" ' +
         'fill="' + (i % 2 ? '#2f9e3f' : '#43b552') + '" stroke="#1c6b28" stroke-width="4"/>' +
         '<path d="M0 -6 L2 -84" stroke="#1c6b28" stroke-width="2.5" fill="none"/></g>';
  }
  h += '<rect x="-9" y="-8" width="18" height="26" rx="6" fill="#6f8a3a" stroke="#40551f" stroke-width="4"/>';
  return h + '</g>';
}
function buildDecor(){
  let h = '';
  /* rangoli + diyas at the two front corners of the veranda */
  h += rangoli(82, 700) + rangoli(1198, 700);
  [[40, 678, 0], [82, 690, .12], [124, 676, .2], [1156, 676, .08], [1198, 690, .17], [1240, 678, .05]]
    .forEach(d => { h += diya(d[0], d[1], d[2]); });

  h += bananaPlant(46, 616, .95) + bananaPlant(472, 626, .78);
  $('#decor').innerHTML = h;
}

function buildShaadi(){
  let h = '';
  h += '<defs>' +
    '<linearGradient id="shBr" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#ffe6f1"/><stop offset="46%" stop-color="#ffc4de"/>' +
      '<stop offset="100%" stop-color="#ff9ec7"/></linearGradient>' +
    '<radialGradient id="shGlow" cx="50%" cy="42%" r="52%">' +
      '<stop offset="0" stop-color="#fff7d0" stop-opacity=".95"/>' +
      '<stop offset="100%" stop-color="#fff7d0" stop-opacity="0"/></radialGradient>' +
    '<linearGradient id="shCarpet" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="#d81b45"/><stop offset="100%" stop-color="#9c0f30"/></linearGradient>' +
  '</defs>';
  h += '<rect width="1280" height="720" fill="url(#shBr)"/>';
  h += '<rect width="1280" height="720" fill="url(#shGlow)"/>';

  /* pillars at the very edges (the family stands in front of them) */
  const pillar = (x) =>
    '<g>' +
      '<rect x="' + x + '" y="118" width="52" height="572" rx="14" fill="#fff3d9" stroke="#b07a3c" stroke-width="6"/>' +
      '<rect x="' + (x - 8) + '" y="150" width="68" height="17" rx="8" fill="#ffd84d" stroke="#b07a3c" stroke-width="5"/>' +
      '<rect x="' + (x - 8) + '" y="330" width="68" height="17" rx="8" fill="#ffd84d" stroke="#b07a3c" stroke-width="5"/>' +
      '<rect x="' + (x - 8) + '" y="510" width="68" height="17" rx="8" fill="#ffd84d" stroke="#b07a3c" stroke-width="5"/>' +
      '<circle cx="' + (x + 26) + '" cy="118" r="25" fill="#ff9f1c" stroke="#c46b00" stroke-width="5"/>' +
      '<circle cx="' + (x + 26) + '" cy="118" r="7" fill="#fff2c2" opacity=".9"/>' +
    '</g>';
  h += pillar(-4) + pillar(1232);

  /* top beam + floral arch */
  h += '<rect x="0" y="92" width="1280" height="34" rx="12" fill="#e0356b" stroke="#a11444" stroke-width="5"/>';
  h += '<path d="M-20 172 Q640 -96 1300 172" fill="none" stroke="#2f9e3f" stroke-width="26" stroke-linecap="round"/>';
  [[70, 126], [196, 78], [330, 46], [470, 27], [610, 21], [750, 27], [890, 46], [1022, 78], [1148, 126]]
    .forEach((p, i) => {
      h += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="30" fill="' + (i % 2 ? '#ff9f1c' : '#ffd23f') +
           '" stroke="#c46b00" stroke-width="5"/>' +
           '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="9" fill="#fff2c2" opacity=".92"/>';
    });

  /* hanging marigold strings down the sides */
  for (let s = 0; s < 8; s++){
    const x = 96 + s * 156, drop = 196 + (s % 3) * 36;
    h += '<path d="M' + x + ' 128 L' + x + ' ' + drop + '" fill="none" stroke="#2f9e3f" stroke-width="4"/>';
    for (let k = 0; k < 7; k++){
      const y = 138 + k * ((drop - 138) / 6);
      const c = (k + s) % 2 ? '#ff9f1c' : '#ffc21c';
      h += '<circle cx="' + x + '" cy="' + y.toFixed(0) + '" r="13" fill="' + c + '" stroke="#c46b00" stroke-width="3"/>' +
           '<circle cx="' + x + '" cy="' + y.toFixed(0) + '" r="4" fill="#fff0c0" opacity=".85"/>';
    }
    h += '<circle cx="' + x + '" cy="' + drop + '" r="14" fill="#2f9e3f" stroke="#1c6b28" stroke-width="3"/>';
  }

  /* raised carpet / platform for the ceremony */
  h += '<path d="M40 642 H1240 L1300 720 H-20 Z" fill="url(#shCarpet)" stroke="#7d0b26" stroke-width="6"/>';
  h += '<path d="M40 642 H1240" fill="none" stroke="#ffd84d" stroke-width="9"/>';
  h += '<path d="M70 664 H1210" fill="none" stroke="#ffd84d" stroke-width="5" stroke-dasharray="26 16"/>';
  [150, 330, 950, 1130].forEach((x, i) => { h += diya(x, 690, i * 0.28); });
  h += rangoli(640, 688);

  /* a few drifting petals */
  h += '<g fill="#fff" opacity=".75">' +
        '<circle cx="430" cy="300" r="10"/><circle cx="868" cy="248" r="8"/>' +
        '<circle cx="704" cy="366" r="7"/><circle cx="250" cy="392" r="9"/></g>';

  $('#shaadi').innerHTML = '<svg viewBox="0 0 1280 720" preserveAspectRatio="none">' + h + '</svg>';
}

    const d = document.createElement('i');
    d.className = 'conf';
    d.style.left = (Math.random() * 100) + '%';
    d.style.background = CONF_COLORS[(Math.random() * CONF_COLORS.length) | 0];
    d.style.width = (7 + Math.random() * 8) + 'px';
    d.style.height = (10 + Math.random() * 12) + 'px';
    d.style.animationDelay = (Math.random() * 0.9) + 's';
    d.style.animationDuration = (2.3 + Math.random() * 2) + 's';
    d.style.setProperty('--dx', (Math.random() * 160 - 80).toFixed(0) + 'px');
    fx.appendChild(d);
  }
  setTimeout(() => fx.querySelectorAll('.conf').forEach(e => e.remove()), 6200);
}
function hearts(n){
  const hs = ['❤️','💛','💖','💚','💙','🧡'];
  for (let i = 0; i < n; i++){
    const d = document.createElement('i');
    d.className = 'heart';
    d.textContent = hs[(Math.random() * hs.length) | 0];
    d.style.left = (6 + Math.random() * 88) + '%';
    d.style.animationDelay = (Math.random() * 2.2) + 's';
    d.style.animationDuration = (3.2 + Math.random() * 2) + 's';
    d.style.setProperty('--dx', (Math.random() * 120 - 60).toFixed(0) + 'px');
    d.style.setProperty('--rot', (Math.random() * 60 - 30).toFixed(0) + 'deg');
    fx.appendChild(d);
  }
  setTimeout(() => fx.querySelectorAll('.heart').forEach(e => e.remove()), 8000);
}
function titleHTML(text){
  return Array.from(text).map((ch, i) =>
    ch === ' ' ? '<span class="ltr" style="animation-delay:' + (i * 0.035).toFixed(2) + 's">&nbsp;</span>'
               : '<span class="ltr" style="animation-delay:' + (i * 0.035).toFixed(2) + 's">' + ch + '</span>').join('');
}

/* ========================================================== TIMELINE */
const TL = [];
const ev = (t, fn) => TL.push({ t: t, fn: fn });
let timers = [];
let running = false, showStart = 0, endAt = 0;

const slotOf = id => stage.querySelector('.slot[data-id="' + id + '"]');

function popIn(id){
  const s = slotOf(id); if (!s) return;
  s.classList.add('visible');
}
function highlight(id, text, info){
  const c = CHARS.find(x => x.id === id); if (!c) return;
  const d = info || c;
  document.querySelectorAll('.slot').forEach(s => {
    s.classList.toggle('active', s.dataset.id === id);
    s.classList.toggle('dim', s.dataset.id !== id);
  });
  /* card */
  card.classList.remove('on'); void card.offsetWidth;
  cnameEl.textContent = d.name.toUpperCase();
  croleEl.textContent = d.role;
  ctagEl.textContent = d.tag;
  card.classList.add('on');
  /* spotlight */
  const s = slotOf(id);
  spot.style.transform = 'translate(' + (s.offsetLeft + s.offsetWidth / 2) + 'px,585px) translate(-50%,-50%) scale(1)';
  spot.classList.add('on');
  /* speech bubble — floats just above the (zoomed) character's head */
  const size = parseFloat(getComputedStyle(s.querySelector('.in')).getPropertyValue('--size')) || 1;
  const inBottom = stage.offsetTop + s.offsetTop + s.offsetHeight;
  let headTop = inBottom - (330 * size * 1.24) + (46 * size * 1.24) - 30 - 16;
  if (id === 'ajeet') headTop -= 34;    /* leave room for his spinning star badge */
  const bx = Math.max(175, Math.min(1030, s.offsetLeft + s.offsetWidth / 2));
  bubble.style.left = bx + 'px';
  bubble.style.top = Math.round(headTop) + 'px';
  bubbleText.textContent = text;
  bubble.classList.add('on');
  /* audio + fx */
  sTada(); flash(); sSparkle(0.35);
}
function unhighlight(id){
  const s = slotOf(id);
  if (s) s.classList.remove('active');
  bubble.classList.remove('on');
  spot.classList.remove('on');
  card.classList.remove('on');
}
function clearHighlight(){
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('active', 'dim'));
  bubble.classList.remove('on');
  spot.classList.remove('on');
  card.classList.remove('on');
}
function showAll(){
  document.querySelectorAll('.slot').forEach(s => s.classList.add('visible'));
}

/* meet-the-family order — Ajeet, the superstar of the house, gets a longer, sillier slot */
const HL_SEQ = [
  { id:'anil',  dur:2700 },
  { id:'vijay', dur:2700 },
  { id:'amit',  dur:2700 },
  { id:'pooja', dur:2700 },
  { id:'ajeet', dur:4200 }
];
const HIGHLIGHTS = (function(){
  let t = 6300;
  return HL_SEQ.map(h => { const o = { t:t, id:h.id, dur:h.dur }; t += h.dur + 300; return o; });
})();
const AJEET_GAG = HIGHLIGHTS[4].t + 2000;
/* ---- act 4: Pooja ki shaadi + bidaai ---- */
const SHAADI = 23200;    /* mandap backdrop fades in            */
const DRESS  = 24400;    /* magic bridal dress change           */
const VIDAAI = 27400;    /* bidaai — Pooja leaves her family    */
const FINALE = 29800;    /* four-member party                   */
const THEEND = 34400;
const DURATION = 37600;

function bidaai(){
  const p = slotOf('pooja'); if (!p) return;
  stage.classList.remove('cheer', 'reaction');
  clearHighlight();
  const v = slotOf('vijay'); if (v) v.classList.add('crying');
  /* a farewell bubble over Pooja */
  bubbleText.textContent = 'Bye Mummy–Papa… 🥺';
  bubble.style.left = (stage.offsetLeft + p.offsetLeft + p.offsetWidth / 2) + 'px';
  bubble.style.top = '372px';
  bubble.classList.add('on');
  sAww();
  setTimeout(() => {
    bubble.classList.remove('on');
    p.classList.add('leaving');
    sWhoosh();
  }, 1250);
  setTimeout(() => {
    stage.classList.add('centered4');
    $('#framed').classList.add('on');
    sTada(); hearts(16); confetti(46);
  }, 2550);
  setTimeout(() => { if (v) v.classList.remove('crying'); }, 6200);
}

function resetWedding(){
  const sh = document.getElementById('shaadi'); if (sh) sh.classList.remove('on');
  const fr = document.getElementById('framed'); if (fr) fr.classList.remove('on');
  stage.classList.remove('centered4', 'cheer');
  const p = slotOf('pooja'); if (p) p.classList.remove('leaving', 'crying');
  const v = slotOf('vijay'); if (v) v.classList.remove('crying');
  bubble.classList.remove('on');
  setPoojaNormal();
}

function ajeetGag(){
  const s = slotOf('ajeet'); if (!s) return;
  stage.classList.add('reaction');
  s.classList.add('superjump');
  bubbleText.textContent = 'Dekho meri jump! 🚀';
  card.classList.remove('on'); void card.offsetWidth;
  cnameEl.textContent = 'AJEET ⭐';
  croleEl.textContent = 'Star of the House';
  ctagEl.textContent = 'Ek jump… aur poora ghar hil gaya! 😂';
  card.classList.add('on');
  sBoing(); sJump(); sJump(0.4); confetti(60);
  const cx = s.offsetLeft + s.offsetWidth / 2;
  ['😂','🤣','😜','😂'].forEach((e, i) => {
    const d = document.createElement('i');
    d.className = 'lol'; d.textContent = e;
    d.style.left = (cx - 130 + i * 72) + 'px';
    d.style.top = (270 + (i % 2) * 46) + 'px';
    d.style.animationDelay = (i * 0.12) + 's';
    fx.appendChild(d);
    setTimeout(() => d.remove(), 2200);
  });
  setTimeout(() => { stage.classList.remove('reaction'); s.classList.remove('superjump'); }, 2600);
}

function buildTimeline(){
  TL.length = 0;

  /* ---- act 1: curtain up ---- */
  ev(0, () => { sDrumroll(1.9); });
  ev(260, () => { logo.classList.add('show', 'big'); logo.classList.remove('small');
                  logo.innerHTML = titleHTML('🙏 NAMASTE!'); });
  ev(1250, () => sSparkle());
  ev(2050, () => { logo.classList.remove('show'); sWhoosh(); frame.classList.add('open'); });
  ev(2450, () => startMusic());

  /* ---- act 2: family pops in ---- */
  ['anil', 'vijay', 'amit', 'pooja', 'ajeet'].forEach((id, i) => {
    ev(3000 + i * 320, () => { popIn(id); sPop(); sBoing(0.05); });
  });
  ev(4350, () => { sSparkle(0); sSparkle(0.12); });
  ev(4700, () => {
    logo.innerHTML = titleHTML('The Kushwaha Family') +
      '<div class="sub">Ek Indian family — full masti! 🎉</div>';
    logo.classList.add('show', 'big');
    sTada(); flash(); confetti(70);
  });
  ev(6100, () => { logo.classList.remove('big'); logo.classList.add('small'); logo.innerHTML = titleHTML('The Kushwaha Family'); });

  /* ---- act 3: meet the family ---- */
  HIGHLIGHTS.forEach(h => {
    ev(h.t, () => highlight(h.id, CHARS.find(c => c.id === h.id).bubble));
    ev(h.t + h.dur, () => unhighlight(h.id));
  });
  /* little in-between moments */
  ev(9100,  () => { sJump(); sClick(); });
  ev(12100, () => { sBoing(); });
  ev(15100, () => { sSparkle(0); sPop(); });
  ev(18100, () => { sDrumroll(0.7); });        /* drumroll for the superstar */
  ev(AJEET_GAG, () => ajeetGag());             /* Ajeet steals the show */

  /* ---- act 4: Pooja ki shaadi ---- */
  ev(SHAADI, () => {
    $('#shaadi').classList.add('on');            /* the mandap fades in */
    sShehnai(); sCheer();
    logo.classList.remove('small');
    logo.innerHTML = titleHTML('💐 Pooja ki Shaadi 💐') +
      '<div class="sub">Aaj ghar mein khushi hi khushi! 🎉</div>';
    logo.classList.add('show', 'big');
    confetti(70); hearts(14); flash();
  });
  ev(SHAADI + 1600, () => {
    logo.classList.remove('big'); logo.classList.add('small');
    logo.innerHTML = titleHTML('💐 Pooja ki Shaadi');
  });
  ev(DRESS, () => {                              /* magic dress change */
    setPoojaBridal();
    sWhoosh(); flash(); sSparkle(0.25); confetti(52); hearts(10);
  });
  ev(DRESS + 500, () => {
    highlight('pooja', POOJA_BRIDAL.bubble, POOJA_BRIDAL);
  });
  ev(SHAADI + 2600, () => {                      /* the family celebrates */
    stage.classList.add('cheer');
    sCheer(); hearts(10);
  });

  /* ---- act 5: the bidaai — Pooja leaves the family ---- */
  ev(VIDAAI, () => bidaai());

  /* ---- act 6: four-member finale ---- */
  ev(FINALE, () => {
    clearHighlight();
    stage.classList.remove('cheer');
    stage.classList.add('party');
    sCheer(); confetti(130); hearts(22); flash();
    logo.classList.remove('small');
    logo.innerHTML = titleHTML('The Kushwaha Family') +
      '<div class="sub">❤️ 4 hearts • 1 home • 🌟 Ajeet is the superstar</div>';
    logo.classList.add('show', 'big');
    [0, 0.5, 1, 1.5, 2].forEach((d) => setTimeout(() => { sJump(); confetti(28); }, d * 1000));
  });
  ev(FINALE + 2400, () => { spot.style.transform = 'translate(640px,600px) translate(-50%,-50%) scale(1.55)'; spot.classList.add('on'); });
  ev(THEEND, () => {
    sFinal(); hearts(26); confetti(90);
    logo.innerHTML = titleHTML('The End ✨') +
      '<div class="sub">👋 Bidaai ho gayi — ab ghar mein 4 log! See you soon 🥺💐</div>';
    logo.classList.add('show', 'big');
  });
  ev(THEEND + 2700, () => {
    endcard.querySelector('.sub').textContent = 'Starring Anil • Vijay • Amit • Ajeet   •   Special: Pooja (Dulhan) 💐';
    endcard.classList.add('on'); stopMusic(1.6);
  });
  ev(DURATION - 1200, () => { controls.classList.add('on'); running = false; });
}

function clearTimers(){ timers.forEach(t => clearTimeout(t)); timers = []; }

function ensureState(){
  /* make sure a jump/restart never leaves the stage half-built */
  frame.classList.add('open');
  showAll();
}

function run(){
  initAudio();
  buildStage(); clearTimers(); clearHighlight();
  resetWedding();
  stage.classList.remove('party');
  endcard.classList.remove('on'); endcard.querySelector('.sub').textContent = '';
  fx.innerHTML = ''; flashEl.classList.remove('on');
  frame.classList.remove('open');                 /* curtains closed */
  logo.classList.remove('show', 'big', 'small'); logo.innerHTML = '';
  controls.classList.remove('on');
  overlay.classList.add('hide');
  barFill.style.width = '0%';
  spot.classList.remove('on'); spot.style.transform = 'translate(-9999px,-9999px)';
  bubble.classList.remove('on');

  running = true; showStart = performance.now(); endAt = DURATION;
  TL.forEach(e => timers.push(setTimeout(() => { try { e.fn(); } catch (err) { console.warn(err); } }, e.t)));
  tick();
}
function stopMusicSafe(){ try { stopMusic(0.4); } catch (e) {} }
function tick(){
  if (!running) return;
  const el = performance.now() - showStart;
  barFill.style.width = Math.min(100, el / DURATION * 100).toFixed(1) + '%';
  if (el < DURATION) requestAnimationFrame(tick);
}
function skip(){
  if (!running) return;
  const el = performance.now() - showStart;
  const pts = HIGHLIGHTS.map(h => h.t).concat([SHAADI, DRESS, VIDAAI, FINALE]);
  const next = pts.find(t => t > el + 400);
  jumpTo(next != null ? next : FINALE);
}
function jumpTo(t){
  clearTimers(); clearHighlight();
  ensureState();
  resetWedding();
  stage.classList.remove('party');
  endcard.classList.remove('on'); fx.innerHTML = '';
  logo.innerHTML = titleHTML('The Kushwaha Family');
  logo.classList.add('show', 'small'); logo.classList.remove('big');
  bubble.classList.remove('on'); card.classList.remove('on');
  spot.classList.remove('on');
  /* if we jump straight into the wedding act, restore its state */
  if (t >= DRESS){ $('#shaadi').classList.add('on'); setPoojaBridal(); }
  else if (t >= SHAADI){ $('#shaadi').classList.add('on'); }
  if (t >= VIDAAI){
    const p = slotOf('pooja'); if (p) p.classList.add('leaving');
    stage.classList.add('centered4'); $('#framed').classList.add('on');
  }
  if (!actx) initAudio();
  if (!musicRunning) startMusic();
  showStart = performance.now() - t;
  TL.filter(e => e.t >= t).forEach(e => timers.push(setTimeout(() => { try { e.fn(); } catch (err) {} }, e.t - t)));
  running = true; tick();
}

/* ========================================================== CONTROLS */
$('#playBtn').addEventListener('click', () => { initAudio(); sClick(); run(); });
$('#replay').addEventListener('click', () => { initAudio(); stopMusic(0.3); sClick(); setTimeout(run, 260); });
$('#skip').addEventListener('click', () => { sClick(); skip(); });
$('#mute').addEventListener('click', (e) => {
  initAudio();
  const on = !soundOn; setSound(on);
  e.currentTarget.classList.toggle('on', on);
  e.currentTarget.textContent = on ? '🔊 Sound' : '🔇 Muted';
  sClick();
});
/* --- record the show to a .webm video file (tab capture) --- */
$('#rec').addEventListener('click', async () => {
  const btn = $('#rec');
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 30 }, audio: true, preferCurrentTab: true
    });
    const chunks = [];
    const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
      ? 'video/webm;codecs=vp9,opus' : 'video/webm';
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const url = URL.createObjectURL(new Blob(chunks, { type: mime }));
      const a = document.createElement('a');
      a.href = url; a.download = 'kushwaha-family-intro.webm';
      a.click(); setTimeout(() => URL.revokeObjectURL(url), 4000);
      btn.textContent = '⏺ Record'; btn.classList.add('rec');
    };
    rec.start();
    btn.textContent = '⏹ Stop'; btn.classList.remove('rec');
    run();                                  /* restart the show right after capture starts */
  } catch (err) {
    btn.textContent = '⏺ Record';
    alert('Recording needs screen-capture permission.\nPick "This tab" and tick "Share tab audio".\n\n' + err.message);
  }
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space'){ e.preventDefault(); if (!running) { initAudio(); run(); } else skip(); }
  if (e.key === 'm' || e.key === 'M') $('#mute').click();
});

/* ========================================================== BOOT */
buildStage(); buildFlowers(); buildToran(); buildDecor(); buildGarland(); buildShaadi(); buildFramed(); buildTimeline();
/* gentle preview behind the overlay */
setTimeout(() => { showAll(); }, 300);

})();
